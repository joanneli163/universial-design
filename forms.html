<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
    <style>
        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        input:focus {
            outline: 2px solid blue;
        }
        input:invalid {
            border: 2px solid red;
        }
        label {
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Accessible Forms</h1>
    </header>
    <main>
        <section>
            <h2>Form example</h2>
            <form id="myform" method="post">
                <fieldset>
                    <legend>Personal Information</legend>

                    <label for="username">What is your name?
                        <input type="text" id="username" required>
                    </label>
                    
                    <label for="email">What is your email?
                        <input type="email" id="email" required>
                    </label>
                    
                    <label for="website">What is your website?
                        <input type="url" id="website">
                    </label>

                    <label for="phone">What is your phone number?
                        <input type="tel" id="phone" minlength="10">
                    </label>

                    <label for="age">How old are you?
                        <input type="number" id="age" min="0" max="120">
                    </label>
                    
                    <label for="password">Create a password:
                        <input type="text" id="password" maxlength="20" minlength="8" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%^&amp;+!=]).*" required="">
                    </label>
                    <ul class="inputRequirements">
                        <li>Must be at least 8 characters long</li>
                        <li>Must contain a number</li>
                        <li>Must contain a special character</li>
                        <li>Must contain an uppercase and lowercase letter</li>
                    </ul>

                    <input type="submit">
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>

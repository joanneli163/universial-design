<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
    <style>
        table, th, td {
            border-collapse: collapse;
        }
        td {
            border-collapse: collapse;
            border: 1px solid red;
            padding: 5px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Accessible Tables</h1>
    </header>
    <main>
        <section>
            <h2>Lion Table</h2>
            <table>
                <caption>Animal that can kill you</caption>
                <thead>
                    <tr>
                        <th scope="col">Lions</th>
                        <th scope="col">Tiger</th>
                        <th scope="col">Bears</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>Simba</td>
                        <td>Tigger</td>
                        <td>Winney</td>
                    </tr>
                    <tr>
                        <td>THREE</td>
                        <td>FOUR</td>
                        <td>FIVE</td>
                    </tr>
                </tbody>
            </table>
        </section>
    </main>
</body>
</html>
